name: rocm-validation-suite
title: ROCm Validation Suite
license: MIT
version: '1.7.0'
summary: A system validation and diagnostics tool for AMD GPUs
description: |
  NOTE: This is a wrapper of the official package, but it is not verified,
  affiliated with, or supported by AMD.

  The ROCm Validation Suite (RVS) is a system validation and diagnostics tool
  for monitoring, stress testing, detecting and troubleshooting issues that
  affects the functionality and performance of AMD GPU(s) operating in a
  high-performance/AI/ML computing environment. RVS is enabled using the ROCm
  software stack on a compatible software and hardware platform.

  RVS is a collection of tests, benchmarks and qualification tools each
  targeting a specific sub-system of the ROCm platform. All of the tools are
  implemented in software and share a common command line interface. Each set
  of tests are implemented in a "module" which is a library encapsulating the
  functionality specific to the tool. The CLI can specify the directory
  containing modules to use when searching for libraries to load. Each module
  may have a set of options that it defines and a configuration file that
  supports its execution.

website: https://rocm.docs.amd.com/projects/ROCmValidationSuite/en/latest/
contact: https://github.com/canonical/rocm-validation-suite-snap/issues
issues: https://github.com/canonical/rocm-validation-suite-snap/issues
source-code: https://github.com/ROCm/ROCmValidationSuite

base: core26
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:

plugs:
  shared-memory:
    private: true
  rocm:
    interface: content
    content: rocm-inference-10-0-2604
    target: $SNAP/opt/rocm
    default-provider: rocm-inference

apps:
  rocm-validation-suite:
    command: opt/rocm-validation-suite/bin/rvs
    environment:
      LD_LIBRARY_PATH: $SNAP/opt/rocm-validation-suite/lib:$SNAP/opt/rocm/lib:$SNAP/opt/rocm/lib/llvm/lib:$SNAP/opt/rocm/lib/rocm_sysdeps/lib:$LD_LIBRARY_PATH
      PATH: $SNAP/opt/rocm-validation-suite/bin:$SNAP/opt/rocm/bin:$SNAP/opt/rocm/lib/llvm/bin:$PATH
      ROCM_PATH: $SNAP/opt/rocm
      HIP_PATH: $SNAP/opt/rocm
      HIP_DEVICE_LIB_PATH: $SNAP/opt/rocm/lib/llvm/amdgcn/bitcode
    extensions: [gpu]
    plugs:
      - hardware-observe
      - home
      - opengl
      - process-control
      - removable-media
      - rocm
      - system-observe

parts:
  rocm-validation-suite:
    plugin: cmake

    source: https://github.com/ROCm/ROCmValidationSuite.git
    source-type: git
    source-tag: v${SNAPCRAFT_PROJECT_VERSION}
    source-depth: 1
    source-submodules:
      - external/TransferBench

    build-snaps:
      - rocm-inference/latest/stable

    build-packages:
      - jq
      - libnuma-dev
      - libpci-dev
      - libyaml-cpp-dev

    build-environment:
      - ROCM_PATH: /snap/rocm-inference/current/opt/rocm
      - HIP_PATH: $ROCM_PATH
      - HIPCC_PATH: $ROCM_PATH
      - HIP_DEVICE_LIB_PATH: $ROCM_PATH/lib/llvm/amdgcn/bitcode
      - PATH: $ROCM_PATH/bin:$ROCM_PATH/lib/llvm/bin:$PATH
      - LD_LIBRARY_PATH: $ROCM_PATH/lib:$ROCM_PATH/lib/llvm/lib:$ROCM_PATH/lib/rocm_sysdeps/lib:${LD_LIBRARY_PATH:-}

    override-pull: |
      craftctl default
      GPU_FLAGS=$(
        jq -er '.dist_amdgpu_targets' "$ROCM_PATH/share/therock/dist_info.json" \
        | tr ';' '\n' \
        | xargs -n1 printf -- '--offload-arch=%s '
      )
      test -n "$GPU_FLAGS"
      sed -i \
        "s|^set(HCC_CXX_FLAGS .*)|set(HCC_CXX_FLAGS \"$GPU_FLAGS\")|" \
        "$CRAFT_PART_SRC/CMakeLists.txt"

    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/opt/rocm-validation-suite
      - -DCPACK_PACKAGING_INSTALL_PREFIX=/opt/rocm-validation-suite
      - -DROCM_PATH=$ROCM_PATH
      - -DROCM_MAJOR_VERSION=10
      - -DFETCH_ROCMPATH_FROM_ROCMCORE=OFF
      - -DRVS_BUILD_TESTS=OFF
      - -DBUILD_TRANSFERBENCH_CLI=OFF
      - '-DCMAKE_PREFIX_PATH="$ROCM_PATH;$ROCM_PATH/lib/rocm_sysdeps"'

    prime:
      - -opt/rocm-validation-suite/include
      - -opt/rocm-validation-suite/lib/cmake
      - -opt/rocm-validation-suite/share/man
      - -opt/rocm-validation-suite/share/rocm-validation-suite/userguide
