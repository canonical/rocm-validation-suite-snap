name: Task
description: Submit a task
type: task
body:
  - type: checkboxes
    id: check-existing-issues
    attributes:
      label: Check existing issues
      options:
        - label: I've verified that this task isn't described by any existing issues.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Task description
      placeholder: >
        A clear and concise description of the work to be done.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Definition of done
      description: The acceptance criteria for this task
      placeholder: >
        A clear and concise description of what "done" looks like.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
